name: sync-gtranslate-hosts

on:
  schedule:
    # 每周一 03:00 UTC 跑一次
    - cron: "0 3 * * 1"
  workflow_dispatch: {} # 也可在 Actions 页手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream raw IP list
        run: |
          curl -fsSL -o ip.txt \
            "https://raw.githubusercontent.com/Ponderfly/GoogleTranslateIpCheck/master/src/GoogleTranslateIpCheck/GoogleTranslateIpCheck/ip.txt"

      - name: Convert to hosts format
        run: |
          python3 convert.py ip.txt hosts.txt --domain translate.googleapis.com --limit 60

      - name: Commit if changed
        run: |
          if ! git diff --quiet hosts.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add hosts.txt
            git commit -m "chore: sync google translate hosts $(date -u +%Y-%m-%d)"
            git push
          else
            echo "hosts.txt unchanged, skipping commit"
          fi